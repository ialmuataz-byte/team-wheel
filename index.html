<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عجلة الفريق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
<style>
/* Layout: game-night stage — wheel on one side, question card on the other, scoreboard under the wheel. Single deliberate dark look. */
:root{
  --ink:#151c31; --panel:#1e2744; --panel-2:#253057; --line:#34416c;
  --sand:#f4ead5; --muted:#aab2cc;
  --saffron:#f3aa3c; --teal:#35b9a6; --coral:#ea6a50; --plum:#9a8ff0; --rose:#e98bb4;
  --good:#5fd08a; --bad:#ef6b6b;
  --f-display:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ink);color:var(--sand)}
body{font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;
  background:radial-gradient(1200px 600px at 80% -10%, #22305a 0%, transparent 60%), var(--ink);min-height:100%}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,4.5vw,44px);margin:0;line-height:1.1;text-wrap:balance}
h1 span{color:var(--saffron)}
.sub{color:var(--muted);margin:4px 0 0;font-size:15px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}

.wheel-box{position:relative;width:100%;max-width:440px;aspect-ratio:1;margin:0 auto}
#wheel{width:100%;height:100%;display:block}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;
  border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid var(--sand);
  filter:drop-shadow(0 3px 4px rgba(0,0,0,.5));z-index:2}
#spin{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:26%;aspect-ratio:1;border-radius:50%;
  border:5px solid var(--sand);background:var(--ink);color:var(--sand);font-family:var(--f-display);font-weight:700;
  font-size:clamp(18px,4.5vw,26px);cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.45);transition:transform .15s}
#spin:hover:not(:disabled){transform:translate(-50%,-50%) scale(1.05)}
#spin:disabled{opacity:.7;cursor:default}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.label{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:500}

.score-list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.score-list li{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;background:var(--panel-2)}
.score-list li.done .nm{color:var(--muted)}
.score-list .tag{font-size:12px;color:var(--muted)}
.score-list .pts{font-variant-numeric:tabular-nums;font-weight:700;color:var(--saffron);min-width:2ch;text-align:left}
.score-list li.lead .nm::after{content:" ★";color:var(--saffron)}

.stage{min-height:460px;display:flex;flex-direction:column;gap:18px}
.idle{display:flex;flex-direction:column;gap:14px;justify-content:center;flex:1;text-align:center;align-items:center}
.idle .big{font-family:var(--f-display);font-size:clamp(24px,3.6vw,34px);margin:0}
.idle p{color:var(--muted);max-width:44ch;margin:0}
.winner{font-family:var(--f-display);font-weight:700;font-size:clamp(40px,7vw,68px);line-height:1.1;margin:0;color:var(--saffron)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.cat{background:var(--panel-2);border:2px solid var(--line);border-radius:12px;padding:16px;color:var(--sand);text-align:right;cursor:pointer;font:inherit;display:flex;flex-direction:column;gap:4px;transition:border-color .15s,transform .15s}
.cat:hover{transform:translateY(-2px)}
.cat strong{font-family:var(--f-display);font-size:20px}
.cat small{color:var(--muted)}
.cat[data-c="visual"]{border-color:color-mix(in srgb,var(--teal) 55%,var(--line))}
.cat[data-c="culture"]{border-color:color-mix(in srgb,var(--saffron) 55%,var(--line))}
.cat[data-c="scenario"]{border-color:color-mix(in srgb,var(--coral) 55%,var(--line))}
.cat[data-c="random"]{border-style:dashed}

.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chip{display:inline-block;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:700;color:var(--ink)}
.chip.country{background:var(--plum)}.cat[data-c="country"]{border-color:color-mix(in srgb,var(--plum) 55%,var(--line))}
.chip.visual{background:var(--teal)}.chip.culture{background:var(--saffron)}.chip.scenario{background:var(--coral)}
.who{font-family:var(--f-display);font-size:22px}
.who b{color:var(--saffron)}
.qtext{font-size:clamp(20px,2.6vw,27px);font-weight:700;line-height:1.5;margin:0;text-wrap:balance}
.visual-box{background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;justify-content:center;align-items:center;min-height:170px;overflow-x:auto}
.emoji-line{font-size:clamp(40px,7vw,64px);letter-spacing:.08em;direction:ltr;text-align:center;line-height:1.3}
.eq{direction:ltr;font-size:clamp(24px,4vw,34px);line-height:1.8;text-align:center;font-variant-numeric:tabular-nums}
.seq{direction:ltr;font-size:clamp(28px,5vw,44px);font-weight:700;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.seq .q{color:var(--saffron)}
.letters{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.letters span{width:58px;height:58px;display:grid;place-items:center;border-radius:10px;background:var(--panel-2);border:2px solid var(--teal);font-size:30px;font-weight:700}
.visual-box svg{max-width:100%;height:auto;color:var(--sand)}

.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.opts{grid-template-columns:minmax(0,1fr)}}
.opt{font:inherit;font-size:18px;text-align:right;padding:14px 16px;border-radius:10px;border:2px solid var(--line);background:var(--panel-2);color:var(--sand);cursor:pointer;display:flex;gap:10px;align-items:center}
.opt .k{font-weight:700;color:var(--muted);min-width:1.4em}
.opt:hover:not(:disabled){border-color:var(--saffron)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--panel-2))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--panel-2))}
.opt:disabled{cursor:default}

.answer{background:color-mix(in srgb,var(--teal) 14%,var(--panel-2));border:1px solid var(--teal);border-radius:10px;padding:14px 16px;font-size:18px}
.answer b{color:var(--teal)}
.why{margin-top:8px;font-size:16px;color:var(--sand);line-height:1.7}
.verdict{font-weight:700;font-size:18px}
.verdict.ok{color:var(--good)}.verdict.no{color:var(--bad)}

.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto}
button.btn{font:inherit;font-weight:700;padding:11px 18px;border-radius:10px;border:2px solid transparent;cursor:pointer}
.btn.primary{background:var(--saffron);color:var(--ink)}
.btn.good{background:var(--good);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--sand);border-color:var(--line)}
.btn.small{padding:7px 12px;font-size:14px}
.btn:hover{filter:brightness(1.08)}
button:focus-visible,.toggle input:focus-visible+span{outline:3px solid var(--saffron);outline-offset:2px}

.timer{display:flex;align-items:center;gap:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.timer .bar{flex:1;height:8px;border-radius:99px;background:var(--panel-2);overflow:hidden}
.timer .bar i{display:block;height:100%;background:var(--coral);width:100%;transition:width 1s linear}
.timer.over .bar i{background:var(--bad)}

.toggle{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--saffron)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.note{color:var(--muted);font-size:14px;margin:0}

.chip.team{background:var(--rose)}.cat[data-c="team"]{border-color:color-mix(in srgb,var(--rose) 55%,var(--line))}
.names{display:flex;flex-wrap:wrap;gap:8px}
.name-chip{font:inherit;font-size:18px;font-weight:700;padding:10px 18px;border-radius:999px;border:2px solid var(--line);background:var(--panel-2);color:var(--sand);cursor:pointer}
.name-chip:hover:not(:disabled){border-color:var(--rose)}
.name-chip.on{background:var(--rose);border-color:var(--rose);color:var(--ink)}
.steal-box{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px;border:2px dashed var(--saffron);border-radius:12px}
.steal-name{font-size:clamp(32px,5vw,48px);font-weight:700;color:var(--saffron)}
.steal-tag{background:var(--saffron);color:var(--ink);border-radius:6px;padding:0 8px;font-size:.8em;margin-inline-end:4px}
/* Presentation mode */
body.present .wrap{max-width:none}
body.present .sub, body.present .toggle, body.present #mute{display:none}
body.present .grid{grid-template-columns:minmax(0,34%) minmax(0,1fr)}
body.present .wheel-box{max-width:min(100%,62vh)}
body.present .stage{min-height:70vh;padding:32px}
body.present .qtext{font-size:clamp(28px,3.2vw,46px)}
body.present .opt{font-size:clamp(20px,2vw,28px);padding:18px 20px}
body.present .winner{font-size:clamp(56px,8vw,110px)}
body.present .emoji-line{font-size:clamp(56px,8vw,110px)}
body.present .answer, body.present .verdict{font-size:clamp(20px,1.8vw,26px)}
body.present .why{font-size:clamp(18px,1.5vw,22px)}
body.present .who{font-size:clamp(22px,2vw,30px)}
body.present .score-list li{padding:4px 10px}
@media (max-width:860px){body.present .grid{grid-template-columns:minmax(0,1fr)}}

/* Race map */
.map-card{display:flex;flex-direction:column;gap:12px}
.map-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.map-head h2{margin:0;font-size:22px}
.map-scroll{overflow-x:auto;padding-bottom:4px}
.map{position:relative;min-width:640px;aspect-ratio:1000/400;width:100%}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.stop-lbl{font-family:var(--f-body);font-size:15px;font-weight:500;fill:var(--muted)}
.stop-num{font-family:var(--f-body);font-size:14px;font-weight:700;fill:var(--ink)}
.token{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;display:grid;place-items:center;
  font-weight:700;font-size:12px;color:var(--ink);border:2px solid var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.45);
  transition:left .9s cubic-bezier(.3,1.3,.5,1),top .9s cubic-bezier(.3,1.3,.5,1);z-index:2}
.token.turn{z-index:3;outline:3px solid var(--sand);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
.champ{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;flex:1;justify-content:center}
.champ .winner{font-size:clamp(44px,7vw,80px)}
.rank{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:4px;min-width:min(320px,100%)}
.rank li{display:flex;justify-content:space-between;gap:10px;padding:6px 12px;border-radius:8px;background:var(--panel-2);font-variant-numeric:tabular-nums}
body.present .map{min-width:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes pop{from{transform:scale(.85);opacity:.4}to{transform:scale(1);opacity:1}}
.pop{animation:pop .35s ease-out}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1>عجلة <span>الفريق</span></h1>
      <p class="sub">لفّ العجلة، اختر نوع السؤال، وخلّ الفريق يحكم.</p>
    </div>
    <div class="toolbar">
      <label class="toggle"><input type="checkbox" id="exclude"><span>لا يتكرر الاسم حتى يأخذ الجميع دورهم</span></label>
      <button class="btn primary small" id="present" type="button">وضع العرض</button>
      <button class="btn ghost small" id="mute" type="button">الصوت: يعمل</button>
    </div>
  </header>

  <div class="grid">
    <div class="col">
      <div class="wheel-box">
        <div class="pointer" aria-hidden="true"></div>
        <canvas id="wheel" aria-label="عجلة أسماء الفريق"></canvas>
        <button id="spin" type="button">لُف</button>
      </div>
      <div class="card">
        <div class="qhead">
          <span class="label">المحطات</span>
          <div class="toolbar">
            <button class="btn ghost small" id="newRound" type="button">جولة جديدة</button>
            <span id="resetWrap"><button class="btn ghost small" id="resetScores" type="button">تصفير النقاط</button></span>
          </div>
        </div>
        <ul class="score-list" id="scores"></ul>
      </div>
    </div>

    <section class="card stage" id="stage" aria-live="polite"></section>
  </div>

  <section class="card map-card">
    <div class="map-head">
      <h2>السباق إلى قمة جبل شمس</h2>
      <span class="note">كل إجابة صحيحة تقدّمك محطة. أول من يصل القمة يفوز.</span>
    </div>
    <div class="map-scroll"><div class="map" id="map"></div></div>
    <div class="legend" id="legend"></div>
  </section>
</div>

<script>
const TEAM=["منال","وهيب","مريم","سناء","قحطان","عبدالله","مروى","مزنة","المعتز"];
const COLORS=["#f3aa3c","#35b9a6","#ea6a50"];

const CATS={
  visual:{name:"ألغاز بصرية",hint:"شوف وفكّر"},
  culture:{name:"أسئلة ثقافية",hint:"أربعة خيارات، واحد صح"},
  country:{name:"أي بلاد؟",hint:"رموز تدل على بلد"},
  team:{name:"مين فينا؟",hint:"اختر واحدًا من الفريق"},
  scenario:{name:"ماذا لو؟",hint:"موقف، وكيف بتتصرف"}
};

/* ---------- Question bank ---------- */
const svgSquares=`<svg width="200" height="200" viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="4"><rect x="10" y="10" width="180" height="180"/><line x1="70" y1="10" x2="70" y2="190"/><line x1="130" y1="10" x2="130" y2="190"/><line x1="10" y1="70" x2="190" y2="70"/><line x1="10" y1="130" x2="190" y2="130"/></svg>`;
const svgTriangles=`<svg width="260" height="220" viewBox="0 0 260 220" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"><polygon points="130,10 10,210 250,210"/><line x1="130" y1="10" x2="90" y2="210"/><line x1="130" y1="10" x2="170" y2="210"/><line x1="70" y1="110" x2="190" y2="110"/></svg>`;
const svgOdd=`<svg width="300" height="90" viewBox="0 0 300 90" fill="none" stroke="currentColor" stroke-width="4"><circle cx="40" cy="45" r="30"/><rect x="95" y="15" width="60" height="60"/><polygon points="215,15 245,75 185,75"/><polygon points="270,15 295,45 270,75 245,45" transform="translate(-5 0)" stroke="var(--saffron)"/></svg>`;

const BANK={
 visual:[
  {p:"ما المثل الذي تعبّر عنه هذه الصور؟",v:`<div class="emoji-line">⏰ = ⚔️</div>`,a:"الوقت كالسيف، إن لم تقطعه قطعك",w:"⏰ رمز الوقت، و⚔️ سيف، وعلامة = تعني «كالـ». فالصورة تقول: الوقت كالسيف."},
  {p:"ما المثل الذي تعبّر عنه هذه الصور؟",v:`<div class="emoji-line">🐦✋ &gt; 🐦🐦🐦🌳</div>`,a:"عصفور في اليد ولا عشرة على الشجرة",w:"عصفور واحد في اليد ✋، وعلامة «أكبر من» تعني أنه أفضل من العصافير الكثيرة على الشجرة 🌳."},
  {p:"ما العبارة المقصودة؟",v:`<div class="emoji-line">🍯🌙</div>`,a:"شهر العسل",w:"🌙 الهلال يرمز للشهر، و🍯 جرّة عسل."},
  {p:"ما العبارة المقصودة؟",v:`<div class="emoji-line">📚🐛</div>`,a:"دودة كتب",w:"📚 كتب + 🐛 دودة. وتُقال عن الشخص اللي يحب القراءة كثيرًا."},
  {p:"ما الرقم الناقص؟",v:`<div class="seq">2, 6, 12, 20, 30, <span class="q">?</span></div>`,a:"42",w:"الفرق بين كل رقم والذي بعده يزيد 2 كل مرة: +4، +6، +8، +10، فالتالي +12. و30 + 12 = 42."},
  {p:"ما الرقم الناقص؟",v:`<div class="seq">1, 1, 2, 3, 5, 8, <span class="q">?</span></div>`,a:"13",w:"كل رقم هو مجموع الرقمين اللذين قبله (متتالية فيبوناتشي): 5 + 8 = 13."},
  {p:"ما الرقم الناقص؟",v:`<div class="seq">3, 9, 27, <span class="q">?</span>, 243</div>`,a:"81",w:"كل رقم يساوي الرقم الذي قبله مضروبًا في 3: 27 × 3 = 81، و81 × 3 = 243."},
  {p:"احسب قيمة كل رمز، ثم أوجد الناتج الأخير.",v:`<div class="eq">🍎 + 🍎 + 🍎 = 30<br>🍎 + 🍌 + 🍌 = 18<br>🍌 − 🥥 = 2<br>🥥 + 🍎 + 🍌 = <b style="color:var(--saffron)">?</b></div>`,a:"16",w:"3 تفاحات = 30، إذًا التفاحة 10. ثم 10 + موزتين = 18، إذًا الموزة 4. ثم 4 − جوز الهند = 2، إذًا جوز الهند 2. والمطلوب 2 + 10 + 4 = 16."},
  {p:"كم مربعًا في الشكل؟",v:svgSquares,a:"14 مربعًا",w:"9 مربعات صغيرة (1×1)، و4 مربعات متوسطة (2×2) كل واحد يتكون من 4 صغيرة، ومربع كبير واحد يشمل الشكل كله: 9 + 4 + 1 = 14."},
  {p:"كم مثلثًا في الشكل؟",v:svgTriangles,a:"12 مثلثًا",w:"الخطان النازلان من الرأس يقسمان القاعدة إلى 3 أجزاء، فيتكوّن 6 مثلثات: 3 صغيرة، و2 من جزأين، و1 كبير. والخط الأفقي يكرر نفس التقسيم في الجزء العلوي، فتكون 6 أخرى. المجموع 12."},
  {p:"ما الحرف الذي يأتي بعد ذلك؟",v:`<div class="letters" style="direction:rtl"><span>و</span><span>ا</span><span>ث</span><span>أ</span><span>خ</span><span>س</span><span>س</span><span style="border-color:var(--saffron);color:var(--saffron)">؟</span></div>`,a:"ث",w:"هذه أوائل حروف الأعداد بالترتيب: واحد، اثنان، ثلاثة، أربعة، خمسة، ستة، سبعة… والتالي ثمانية، فالحرف ث."},

const KEY="team-wheel-v1";

S.remaining=S.remaining.filter(n=>TEAM.includes(n));
Object.keys(BANK).forEach(c=>{if(!Array.isArray(S.used[c]))S.used[c]=[];});
TEAM.forEach(n=>{if(typeof S.scores[n]!=="number")S.scores[n]=0;});

function pool(){ if(!S.exclude) return [...TEAM]; if(!S.remaining.length) S.remaining=[...TEAM]; return TEAM.filter(n=>S.remaining.includes(n)); }

/* ---------- Wheel ---------- */
function sizeCanvas(){const d=window.devicePixelRatio||1,w=canvas.clientWidth;canvas.width=w*d;canvas.height=w*d;drawWheel();}
function drawWheel(){
  const names=pool(), n=names.length, W=canvas.width, R=W/2, seg=2*Math.PI/n, d=window.devicePixelRatio||1;
  ctx.clearRect(0,0,W,W);
  ctx.save();ctx.translate(R,R);
  ctx.beginPath();ctx.arc(0,0,R-2*d,0,2*Math.PI);ctx.fillStyle="#f4ead5";ctx.fill();
  for(let i=0;i<n;i++){
    let ci=i%3; if(n>1&&n%3===1&&i===n-1) ci=1;
    const a0=rot+i*seg;
    ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R-8*d,a0,a0+seg);ctx.closePath();
    ctx.fillStyle=COLORS[ci];ctx.fill();
    ctx.strokeStyle="#151c31";ctx.lineWidth=2*d;ctx.stroke();
    const mid=a0+seg/2, flip=Math.cos(mid)<0;
    ctx.save();ctx.rotate(flip?mid+Math.PI:mid);
    ctx.fillStyle="#151c31";ctx.direction="rtl";ctx.textAlign=flip?"left":"right";ctx.textBaseline="middle";
    const fs=Math.max(13,Math.min(24,(R/d)*0.11))*d;
    ctx.font=`700 ${fs}px "IBM Plex Sans Arabic", Tahoma, sans-serif`;
    ctx.fillText(names[i],flip?-(R-26*d):R-26*d,0);
    ctx.restore();
  }
  ctx.restore();
}

/* ---------- Sound ---------- */
let ac=null;
function tick(f=900,dur=.03,vol=.08){
  if(S.muted) return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type="triangle";
    g.gain.setValueAtTime(vol,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+dur);
    o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+dur);}catch(e){}
}
function fanfare(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tick(f,.18,.12),i*110));}

function spin(){
  if(spinning) return;
  if(S.finished){showChampion();return;}
  clearInterval(timerId);
  const names=pool(), n=names.length, seg=2*Math.PI/n;
  const idx=Math.floor(Math.random()*n);
  const jitter=(Math.random()-.5)*seg*.7;
  let target=-Math.PI/2-(idx+.5)*seg+jitter;
  const TAU=2*Math.PI;
  while(target<rot+TAU*5) target+=TAU;
  const start=rot, dist=target-start, dur=reduced()?600:4600, t0=performance.now();
  let lastSeg=Math.floor(((-Math.PI/2-rot)%TAU+TAU)%TAU/seg);
  spinning=true;spinBtn.disabled=true;
  stage.innerHTML=`<div class="idle"><p class="big">العجلة تدور...</p><p>من سيكون صاحب الدور؟</p></div>`;
  (function frame(now){
    const t=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-t,4);
    rot=start+dist*e;drawWheel();
    const s=Math.floor(((-Math.PI/2-rot)%TAU+TAU)%TAU/seg);
    if(s!==lastSeg){lastSeg=s;tick();}
    if(t<1) requestAnimationFrame(frame);
    else{
      rot=rot%TAU;spinning=false;spinBtn.disabled=false;
      const who=names[idx];
      if(S.exclude){S.remaining=S.remaining.filter(x=>x!==who);}
      save();fanfare();showWinner(who);
    }
  })(t0);
}
const reduced=()=>window.matchMedia("(prefers-reduced-motion: reduce)").matches;

}
function pickQ(c){
  let free=BANK[c].map((_,i)=>i).filter(i=>!S.used[c].includes(i));
  if(!free.length){S.used[c]=[];free=BANK[c].map((_,i)=>i);}
  const i=free[Math.floor(Math.random()*free.length)];
  S.used[c].push(i);save();return BANK[c][i];
}
function head(c){return `<div class="qhead"><span class="chip ${c}">${CATS[c].name}</span><span class="who" id="who">السؤال لـ <b>${current.who}</b></span></div>`;}
function setWho(name,stolen){current.ans=name;renderTokens();const w=$("#who");if(w)w.innerHTML=stolen?`<span class="steal-tag">سرقة!</span> الفرصة لـ <b>${name}</b>`:`السؤال لـ <b>${name}</b>`;}
function award(){const n=current.ans||current.who;S.scores[n]=Math.min(GOAL,(S.scores[n]||0)+1);if(S.scores[n]>=GOAL&&!S.finished){S.finished=n;setTimeout(showChampion,1600);}save();renderScores();return n;}

/* Steal: flash names, land on someone other than the owner */
function stealPick(done){
  const others=TEAM.filter(n=>n!==current.who), thief=others[Math.floor(Math.random()*others.length)];
  const box=document.createElement("div");box.className="steal-box";box.innerHTML=`<span class="label">مين بيسرق السؤال؟</span><span class="steal-name" id="sname">…</span>`;
  $("#res").replaceChildren(box);$("#act").innerHTML="";
  let i=0;const steps=reduced()?1:14;
  (function flip(){
    const nm=i<steps-1?others[Math.floor(Math.random()*others.length)]:thief;
    $("#sname").textContent=nm;tick(700+((i%3)*120),.04,.07);
    if(++i<steps)setTimeout(flip,70+i*12);
    else{$("#sname").classList.add("pop");fanfare();setTimeout(()=>{setWho(thief,true);done(thief);},700);}
  })();
}

function runTimer(secs,onEnd){
  clearInterval(timerId);
  const tl=$("#tleft"),tb=$("#tbar"),tm=$("#timer");
  if(!tl)return;tm.classList.remove("over");tl.textContent=secs;tb.style.transition="none";tb.style.width="100%";
  void tb.offsetWidth;tb.style.transition="";
  let left=secs;
  timerId=setInterval(()=>{
    left--;if(!$("#tleft")){clearInterval(timerId);return;}
    tl.textContent=Math.max(0,left);tb.style.width=Math.max(0,left/secs*100)+"%";
    if(left<=5&&left>0)tick(600,.05,.06);
    if(left<=0){clearInterval(timerId);tm.classList.add("over");tick(300,.4,.12);onEnd&&onEnd();}
  },1000);
}
function timerHTML(s){return `<div class="timer" id="timer"><span id="tleft">${s}</span><span>ثانية</span><div class="bar"><i id="tbar"></i></div></div>`;}

function ask(c){
  const q=pickQ(c);current.ans=current.who;current.stolen=false;
  if(c==="culture"){
    const opts=shuffle(q.o.map((t,i)=>({t,ok:i===q.a})));
    const L=["أ","ب","ج","د"];
    stage.innerHTML=`${head(c)}<p class="qtext">${q.q}</p>
      <div class="opts">${opts.map((o,i)=>`<button class="opt" data-ok="${o.ok}" type="button"><span class="k">${L[i]}</span><span>${o.t}</span></button>`).join("")}</div>
      <div id="res"></div><div class="actions" id="act"></div>`;
    const revealAll=()=>stage.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.dataset.ok==="true")x.classList.add("right");});
    stage.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const ok=b.dataset.ok==="true";
      if(ok){revealAll();const n=award();fanfare();$("#res").innerHTML=`<p class="verdict ok">إجابة صحيحة! +1 لـ ${n}</p>`;$("#act").innerHTML=nextBtn();bindNext();return;}
      b.classList.add("wrong");b.disabled=true;
      if(!current.stolen){
        stage.querySelectorAll(".opt").forEach(x=>x.disabled=true);
        $("#res").innerHTML=`<p class="verdict no">إجابة خاطئة.</p>`;
        $("#act").innerHTML=`<button class="btn primary" id="steal" type="button">اسرق السؤال</button><button class="btn ghost" id="show" type="button">أظهر الإجابة</button>`;
        $("#steal").onclick=()=>{current.stolen=true;stealPick(()=>{
          $("#res").innerHTML="";stage.querySelectorAll(".opt").forEach(x=>{if(!x.classList.contains("wrong"))x.disabled=false;});
          $("#act").innerHTML=`<button class="btn ghost" id="show" type="button">أظهر الإجابة</button>`;
          $("#show").onclick=()=>{revealAll();$("#act").innerHTML=nextBtn();bindNext();};
        });};
        $("#show").onclick=()=>{revealAll();$("#res").innerHTML=`<p class="verdict no">الإجابة الصحيحة مظللة بالأخضر.</p>`;$("#act").innerHTML=nextBtn();bindNext();};
      } else {
        revealAll();$("#res").innerHTML=`<p class="verdict no">حتى السرقة ما نجحت! الصحيحة مظللة بالأخضر.</p>`;$("#act").innerHTML=nextBtn();bindNext();
      }
    });
  } else if(c==="visual"||c==="country"){
    stage.innerHTML=`${head(c)}<p class="qtext">${q.p}</p><div class="visual-box">${q.v}</div>
      ${timerHTML(30)}<div id="res"></div><div class="actions" id="act"></div>`;
    const showSol=()=>{
      clearInterval(timerId);
      $("#res").innerHTML=`<div class="answer"><b>الحل:</b> ${q.a}${q.w?`<div class="why"><b>ليش؟</b> ${q.w}</div>`:""}</div>`;
      $("#act").innerHTML=`<button class="btn good" id="got" type="button">${current.ans} أجاب صح (+1)</button><button class="btn ghost" id="next" type="button">ما عرفها</button>`;
      $("#got").onclick=()=>{const n=award();fanfare();$("#act").innerHTML=`<p class="verdict ok">+1 لـ ${n}</p>`+nextBtn();bindNext();};
      bindNext();
    };
    const duringBtns=()=>{
      $("#act").innerHTML=`<button class="btn ghost" id="reveal" type="button">أظهر الحل</button>${current.stolen?"":`<button class="btn primary" id="steal" type="button">خطأ، اسرق السؤال</button>`}`;
      $("#reveal").onclick=showSol;
      const s=$("#steal");if(s)s.onclick=()=>{clearInterval(timerId);current.stolen=true;stealPick(()=>{$("#res").innerHTML="";duringBtns();runTimer(15,showSol);});};
    };
    duringBtns();runTimer(30,showSol);
  } else if(c==="team"){
    stage.innerHTML=`${head(c)}<p class="qtext">${q.q}</p>
      <p class="note">اختر اسمًا، وبعدها الفريق يقرر: موافقين؟</p>
      <div class="names">${TEAM.map(n=>`<button class="name-chip" type="button" data-n="${n}">${n}</button>`).join("")}</div>
      <div id="res"></div><div class="actions" id="act"></div>`;
    stage.querySelectorAll(".name-chip").forEach(b=>b.onclick=()=>{
      stage.querySelectorAll(".name-chip").forEach(x=>x.classList.toggle("on",x===b));
      $("#res").innerHTML=`<p class="verdict">اختار <b style="color:var(--saffron)">${b.dataset.n}</b>. الفريق موافق؟</p>`;
      $("#act").innerHTML=`<button class="btn good" id="agree" type="button">موافقين (+1)</button><button class="btn ghost" id="next" type="button">مو موافقين</button>`;
      $("#agree").onclick=()=>{stage.querySelectorAll(".name-chip").forEach(x=>x.disabled=true);const n=award();fanfare();$("#act").innerHTML=`<p class="verdict ok">+1 لـ ${n}</p>`+nextBtn();bindNext();};
      bindNext();
    });
  } else {
    stage.innerHTML=`${head(c)}<p class="qtext">${q.q}</p>
      ${timerHTML(60)}
      <p class="note">لك دقيقة تشرح فيها تصرفك. بعدها يقرر الفريق: أقنعتنا؟</p>
      <div class="actions" id="act"><button class="btn good" id="conv" type="button">أقنعنا (+1)</button>${nextBtn()}</div>`;
    runTimer(60);
    $("#conv").onclick=()=>{clearInterval(timerId);const n=award();fanfare();$("#act").innerHTML=`<p class="verdict ok">+1 لـ ${n}</p>`+nextBtn();bindNext();};
    bindNext();
  }
}


/* ---------- Race map ---------- */
const STOPS=["مسقط","بركاء","نخل","الرستاق","العوابي","وادي بني عوف","بلد سيت","الحمراء","مسفاة العبريين","خطم الشكلة","قمة جبل شمس"];
const GOAL=STOPS.length-1;
const TOKEN_COLORS=["#f3aa3c","#35b9a6","#ea6a50","#9a8ff0","#e98bb4","#7cc4f0","#c9d66a","#f08a4b","#b9a6ff"];
const PTS=STOPS.map((_,i)=>({x:930-i*86,y:300-i*18+60*Math.sin(i*1.1)}));
function pathD(P){
  let d=`M${P[0].x},${P[0].y}`;
  for(let i=0;i<P.length-1;i++){
    const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||p2;
    const c1={x:p1.x+(p2.x-p0.x)/6,y:p1.y+(p2.y-p0.y)/6},c2={x:p2.x-(p3.x-p1.x)/6,y:p2.y-(p3.y-p1.y)/6};
    d+=` C${c1.x.toFixed(1)},${c1.y.toFixed(1)} ${c2.x.toFixed(1)},${c2.y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;
  }
  return d;
}
function buildMap(){
  const d=pathD(PTS);
  const stops=PTS.map((p,i)=>{
    const last=i===GOAL,first=i===0;
    const r=last||first?17:13, fill=last?"var(--saffron)":first?"var(--teal)":"var(--sand)";
    const below=(i%2===0)?1:-1, ly=p.y+below*(r+20)+ (below>0?6:0);
    return `<circle cx="${p.x}" cy="${p.y}" r="${r}" fill="${fill}" stroke="var(--ink)" stroke-width="3"/>
      <text class="stop-num" x="${p.x}" y="${p.y+5}" text-anchor="middle">${first?"":last?"":i}</text>
      <text class="stop-lbl" x="${p.x}" y="${ly}" text-anchor="middle" ${last?'style="fill:var(--saffron);font-weight:700"':''}>${STOPS[i]}</text>`;
  }).join("");
  const f=PTS[GOAL];
  $("#map").innerHTML=`<svg viewBox="0 0 1000 400" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <polygon points="0,400 0,120 70,40 130,95 190,30 260,110 330,70 400,160 470,400" fill="var(--panel-2)" opacity=".7"/>
    <polygon points="130,95 190,30 225,70 205,75 190,58 160,90" fill="var(--sand)" opacity=".18"/>
    <path d="${d}" fill="none" stroke="var(--line)" stroke-width="26" stroke-linecap="round"/>
    <path d="${d}" fill="none" stroke="var(--sand)" stroke-width="3" stroke-dasharray="10 12" stroke-linecap="round" opacity=".55"/>
    ${stops}
    <line x1="${f.x}" y1="${f.y-16}" x2="${f.x}" y2="${f.y-50}" stroke="var(--sand)" stroke-width="3"/>
    <polygon points="${f.x},${f.y-50} ${f.x-28},${f.y-41} ${f.x},${f.y-32}" fill="var(--coral)"/>
  </svg>`;
  $("#legend").innerHTML=TEAM.map((n,i)=>`<span><i style="background:${TOKEN_COLORS[i]}"></i>${n}</span>`).join("");
  TEAM.forEach((n,i)=>{const t=document.createElement("div");t.className="token";t.id="tok"+i;t.style.background=TOKEN_COLORS[i];t.textContent=n.replace(/^ال/,"").slice(0,3);t.title=n;$("#map").appendChild(t);});
}
function renderTokens(){
  const groups={};
  TEAM.forEach((n,i)=>{const st=Math.min(GOAL,S.scores[n]||0);(groups[st]=groups[st]||[]).push(i);});
  Object.entries(groups).forEach(([st,arr])=>{
    const p=PTS[st];
    arr.forEach((i,k)=>{
      const m=arr.length, cols=Math.min(3,m), rows=Math.ceil(m/cols), G=42;
      const dir=(st%2===0)?-1:1, off=m>1?dir*((rows-1)/2*G+38):0;
      const x=p.x+((k%cols)-(cols-1)/2)*G, y=p.y+(Math.floor(k/cols)-(rows-1)/2)*G+off;
      const t=$("#tok"+i);t.style.left=(x/10)+"%";t.style.top=(y/4)+"%";
      t.classList.toggle("turn",!!current&&(current.ans||current.who)===TEAM[i]);
    });
  });
}
function showChampion(){
  clearInterval(timerId);
  const rank=[...TEAM].sort((a,b)=>S.scores[b]-S.scores[a]);
  stage.innerHTML=`<div class="champ">
    <div class="label">وصل إلى قمة جبل شمس أولًا</div>
    <p class="winner pop">${S.finished}</p>
    <ol class="rank">${rank.map((n,i)=>`<li><span>${i+1}. ${n}</span><span>${STOPS[Math.min(GOAL,S.scores[n])]}</span></li>`).join("")}</ol>
    <div class="actions" style="margin-top:0"><button class="btn primary" id="newRace" type="button">سباق جديد</button></div>
  </div>`;
  $("#newRace").onclick=()=>{TEAM.forEach(n=>S.scores[n]=0);S.finished=null;S.remaining=[...TEAM];save();renderScores();drawWheel();idle("بدأ سباق جديد");};
  [0,350,700].forEach(d=>setTimeout(fanfare,d));
}

/* ---------- Scoreboard ---------- */
function renderScores(){
  const max=Math.max(...TEAM.map(n=>S.scores[n]));
  const list=[...TEAM].sort((a,b)=>S.scores[b]-S.scores[a]);
  $("#scores").innerHTML=list.map(n=>{
    const done=S.exclude&&!S.remaining.includes(n);
    return `<li class="${done?"done":""} ${max>0&&S.scores[n]===max?"lead":""}"><span class="nm">${n}</span><span class="tag">${done?"أخذ دوره":""}</span><span class="pts">${S.scores[n]}/${GOAL}</span></li>`;
  }).join("");
  if($("#tok0"))renderTokens();
}
function bindReset(){
  $("#resetScores").onclick=()=>{
    $("#resetWrap").innerHTML=`<span class="confirm">متأكد؟ <button class="btn ghost small" id="yes" type="button">نعم، صفّر</button><button class="btn ghost small" id="no" type="button">إلغاء</button></span>`;
    $("#yes").onclick=()=>{TEAM.forEach(n=>S.scores[n]=0);S.finished=null;save();renderScores();restoreReset();};
    $("#no").onclick=restoreReset;
  };
}
function restoreReset(){$("#resetWrap").innerHTML=`<button class="btn ghost small" id="resetScores" type="button">تصفير النقاط</button>`;bindReset();}

/* ---------- Init ---------- */
$("#exclude").checked=S.exclude;
$("#exclude").onchange=e=>{S.exclude=e.target.checked;if(S.exclude&&!S.remaining.length)S.remaining=[...TEAM];save();drawWheel();renderScores();};
const muteBtn=$("#mute");
const setMute=()=>muteBtn.textContent=S.muted?"الصوت: مكتوم":"الصوت: يعمل";
muteBtn.onclick=()=>{S.muted=!S.muted;save();setMute();};setMute();
$("#newRound").onclick=()=>{S.remaining=[...TEAM];save();drawWheel();renderScores();idle("بدأت جولة جديدة");};
const presBtn=$("#present");
function setPresent(on){document.body.classList.toggle("present",on);presBtn.textContent=on?"خروج من وضع العرض":"وضع العرض";setTimeout(sizeCanvas,60);}
presBtn.onclick=()=>{
  const on=!document.body.classList.contains("present");setPresent(on);
  try{if(on&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});
      else if(!on&&document.fullscreenElement)document.exitFullscreen().catch(()=>{});}catch(e){}
};
document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement&&document.body.classList.contains("present"))setPresent(false);});
spinBtn.onclick=spin;
bindReset();
document.documentElement.dir="rtl";document.documentElement.lang="ar";
window.addEventListener("resize",sizeCanvas);
buildMap();renderScores();if(S.finished)showChampion();else idle();sizeCanvas();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(drawWheel);
</script>
