<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عجلة الفريق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
<style>
/* Layout: game-night stage — wheel on one side, question card on the other, scoreboard under the wheel. Single deliberate dark look. */
:root{
  --ink:#151c31; --panel:#1e2744; --panel-2:#253057; --line:#34416c;
  --sand:#f4ead5; --muted:#aab2cc;
  --saffron:#f3aa3c; --teal:#35b9a6; --coral:#ea6a50; --plum:#9a8ff0; --rose:#e98bb4;
  --good:#5fd08a; --bad:#ef6b6b;
  --f-display:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--ink);color:var(--sand)}
body{font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 24px;
  background:radial-gradient(1200px 600px at 80% -10%, #22305a 0%, transparent 60%), var(--ink);min-height:100%}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,4.5vw,44px);margin:0;line-height:1.1;text-wrap:balance}
h1 span{color:var(--saffron)}
.sub{color:var(--muted);margin:4px 0 0;font-size:15px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}

.wheel-box{position:relative;width:100%;max-width:340px;aspect-ratio:1;margin:0 auto}
#wheel{width:100%;height:100%;display:block}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;
  border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid var(--sand);
  filter:drop-shadow(0 3px 4px rgba(0,0,0,.5));z-index:2}
#spin{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:26%;aspect-ratio:1;border-radius:50%;
  border:5px solid var(--sand);background:var(--ink);color:var(--sand);font-family:var(--f-display);font-weight:700;
  font-size:clamp(18px,4.5vw,26px);cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.45);transition:transform .15s}
#spin:hover:not(:disabled){transform:translate(-50%,-50%) scale(1.05)}
#spin:disabled{opacity:.7;cursor:default}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.label{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:500}

.score-list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.score-list li{display:grid;grid-template-columns:auto 1fr auto auto auto;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;background:var(--panel-2)}
.score-list li.done .nm{color:var(--muted)}
.score-list .tag{font-size:12px;color:var(--muted)}
.score-list .pts{font-variant-numeric:tabular-nums;font-weight:700;color:var(--saffron);min-width:2ch;text-align:left}
.score-list li.lead .nm::after{content:" ★";color:var(--saffron)}

.stage{min-height:340px;display:flex;flex-direction:column;gap:18px}
.idle{display:flex;flex-direction:column;gap:14px;justify-content:center;flex:1;text-align:center;align-items:center}
.idle .big{font-family:var(--f-display);font-size:clamp(24px,3.6vw,34px);margin:0}
.idle p{color:var(--muted);max-width:44ch;margin:0}
.winner{font-family:var(--f-display);font-weight:700;font-size:clamp(40px,7vw,68px);line-height:1.1;margin:0;color:var(--saffron)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.cat{background:var(--panel-2);border:2px solid var(--line);border-radius:12px;padding:16px;color:var(--sand);text-align:right;cursor:pointer;font:inherit;display:flex;flex-direction:column;gap:4px;transition:border-color .15s,transform .15s}
.cat:hover{transform:translateY(-2px)}
.cat strong{font-family:var(--f-display);font-size:20px}
.cat small{color:var(--muted)}
.cat[data-c="visual"]{border-color:color-mix(in srgb,var(--teal) 55%,var(--line))}
.cat[data-c="culture"]{border-color:color-mix(in srgb,var(--saffron) 55%,var(--line))}
.cat[data-c="scenario"]{border-color:color-mix(in srgb,var(--coral) 55%,var(--line))}
.cat[data-c="random"]{border-style:dashed}

.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chip{display:inline-block;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:700;color:var(--ink)}
.chip.country{background:var(--plum)}.cat[data-c="country"]{border-color:color-mix(in srgb,var(--plum) 55%,var(--line))}
.chip.visual{background:var(--teal)}.chip.culture{background:var(--saffron)}.chip.scenario{background:var(--coral)}
.who{font-family:var(--f-display);font-size:22px}
.who b{color:var(--saffron)}
.qtext{font-size:clamp(20px,2.6vw,27px);font-weight:700;line-height:1.5;margin:0;text-wrap:balance}
.visual-box{background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;justify-content:center;align-items:center;min-height:170px;overflow-x:auto}
.emoji-line{font-size:clamp(40px,7vw,64px);letter-spacing:.08em;direction:ltr;text-align:center;line-height:1.3}
.eq{direction:ltr;font-size:clamp(24px,4vw,34px);line-height:1.8;text-align:center;font-variant-numeric:tabular-nums}
.seq{direction:ltr;font-size:clamp(28px,5vw,44px);font-weight:700;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.seq .q{color:var(--saffron)}
.letters{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.letters span{width:58px;height:58px;display:grid;place-items:center;border-radius:10px;background:var(--panel-2);border:2px solid var(--teal);font-size:30px;font-weight:700}
.visual-box svg{max-width:100%;height:auto;color:var(--sand)}

.visual-box+.timer,.timer+.opts{margin-top:0}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.opts{grid-template-columns:minmax(0,1fr)}}
.opt{font:inherit;font-size:18px;text-align:right;padding:14px 16px;border-radius:10px;border:2px solid var(--line);background:var(--panel-2);color:var(--sand);cursor:pointer;display:flex;gap:10px;align-items:center}
.opt .k{font-weight:700;color:var(--muted);min-width:1.4em}
.opt:hover:not(:disabled){border-color:var(--saffron)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--panel-2))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--panel-2))}
.opt:disabled{cursor:default}

.answer{background:color-mix(in srgb,var(--teal) 14%,var(--panel-2));border:1px solid var(--teal);border-radius:10px;padding:14px 16px;font-size:18px}
.answer b{color:var(--teal)}
.why{margin-top:8px;font-size:16px;color:var(--sand);line-height:1.7}
.verdict{font-weight:700;font-size:18px}
.verdict.ok{color:var(--good)}.verdict.no{color:var(--bad)}

.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto}
button.btn{font:inherit;font-weight:700;padding:11px 18px;border-radius:10px;border:2px solid transparent;cursor:pointer}
.btn.primary{background:var(--saffron);color:var(--ink)}
.btn.good{background:var(--good);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--sand);border-color:var(--line)}
.btn.small{padding:7px 12px;font-size:14px}
.btn:hover{filter:brightness(1.08)}
button:focus-visible,.toggle input:focus-visible+span{outline:3px solid var(--saffron);outline-offset:2px}

.timer{display:flex;align-items:center;gap:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.timer .bar{flex:1;height:8px;border-radius:99px;background:var(--panel-2);overflow:hidden}
.timer .bar i{display:block;height:100%;background:var(--coral);width:100%;transition:width 1s linear}
.timer.over .bar i{background:var(--bad)}

.toggle{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--saffron)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.note{color:var(--muted);font-size:14px;margin:0}

.chip.interview{background:#7cc4f0}
.chip.team{background:var(--rose)}.cat[data-c="team"]{border-color:color-mix(in srgb,var(--rose) 55%,var(--line))}
.names{display:flex;flex-wrap:wrap;gap:8px}
.name-chip{font:inherit;font-size:18px;font-weight:700;padding:10px 18px;border-radius:999px;border:2px solid var(--line);background:var(--panel-2);color:var(--sand);cursor:pointer}
.name-chip:hover:not(:disabled){border-color:var(--rose)}
.name-chip.on{background:var(--rose);border-color:var(--rose);color:var(--ink)}
.steal-box{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px;border:2px dashed var(--saffron);border-radius:12px}
.steal-name{font-size:clamp(32px,5vw,48px);font-weight:700;color:var(--saffron)}
.steal-tag{background:var(--saffron);color:var(--ink);border-radius:6px;padding:0 8px;font-size:.8em;margin-inline-end:4px}
/* Presentation mode */
body.present .wrap{max-width:none}
body.present .sub, body.present .toggle, body.present #mute{display:none}
body.present .grid{grid-template-columns:minmax(0,34%) minmax(0,1fr)}
body.present .wheel-box{max-width:min(100%,62vh)}
body.present .stage{min-height:70vh;padding:32px}
body.present .qtext{font-size:clamp(28px,3.2vw,46px)}
body.present .opt{font-size:clamp(20px,2vw,28px);padding:18px 20px}
body.present .winner{font-size:clamp(56px,8vw,110px)}
body.present .emoji-line{font-size:clamp(56px,8vw,110px)}
body.present .answer, body.present .verdict{font-size:clamp(20px,1.8vw,26px)}
body.present .why{font-size:clamp(18px,1.5vw,22px)}
body.present .who{font-size:clamp(22px,2vw,30px)}
body.present .score-list li{padding:4px 10px}
@media (max-width:860px){body.present .grid{grid-template-columns:minmax(0,1fr)}}

/* Race map */
.map-card{display:flex;flex-direction:column;gap:12px}
.map-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.map-head h2{margin:0;font-size:22px}
.map-scroll{overflow-x:auto;padding-bottom:4px}
.map{position:relative;min-width:640px;aspect-ratio:1000/400;width:100%}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.stop-lbl{font-family:var(--f-body);font-size:15px;font-weight:500;fill:var(--muted)}
.stop-num{font-family:var(--f-body);font-size:14px;font-weight:700;fill:var(--ink)}
.token{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;display:grid;place-items:center;
  font-weight:700;font-size:12px;color:var(--ink);border:2px solid var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.45);
  transition:left .9s cubic-bezier(.3,1.3,.5,1),top .9s cubic-bezier(.3,1.3,.5,1);z-index:2}
.token.turn{z-index:3;outline:3px solid var(--sand);outline-offset:2px}
.map-wrap{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px;align-items:start}
.map-wrap .score-list{margin:0;gap:4px}
.map-wrap .score-list li{grid-template-columns:auto 1fr auto auto auto;padding:4px 10px;font-size:14px}
.score-list li.turn{outline:2px solid var(--sand)}
.score-list .dot{width:12px;height:12px;border-radius:50%;display:inline-block;border:1.5px solid var(--ink)}
.map-wrap .map-scroll{min-width:0}
.racers{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.racers li{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;background:var(--panel-2);font-size:15px}
.racers li.turn{outline:2px solid var(--sand)}
.racers i{width:14px;height:14px;border-radius:50%;display:inline-block;border:1.5px solid var(--ink)}
.racers .st{grid-column:2/4;font-size:12px;color:var(--muted);margin-top:-4px}
.racers .pt{font-weight:700;color:var(--saffron);font-variant-numeric:tabular-nums}
@media (max-width:900px){.map-wrap{grid-template-columns:minmax(0,1fr)}}
.champ{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;flex:1;justify-content:center}
.champ .winner{font-size:clamp(44px,7vw,80px)}
.rank{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:4px;min-width:min(320px,100%)}
.rank li{display:flex;justify-content:space-between;gap:10px;padding:6px 12px;border-radius:8px;background:var(--panel-2);font-variant-numeric:tabular-nums}
body.present .map{min-width:0}
.score-list li.absent{opacity:.5}
.att{font:inherit;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--good);background:transparent;color:var(--good);cursor:pointer}
.att.off{border-color:var(--muted);color:var(--muted)}
.cat:disabled{opacity:.35;cursor:not-allowed;transform:none}

/* Team editor */
.editor{display:flex;flex-direction:column;gap:14px}
.editor h2{margin:0;font-size:24px}
.ed-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.ed-list li{display:flex;gap:6px;align-items:center}
.ed-list input,.ed-add input{flex:1;min-width:0;font:inherit;font-size:17px;padding:9px 12px;border-radius:9px;border:2px solid var(--line);background:var(--panel-2);color:var(--sand)}
.ed-list input:focus,.ed-add input:focus{outline:none;border-color:var(--saffron)}
.ed-del{font:inherit;font-size:13px;font-weight:700;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--bad);cursor:pointer}
.ed-del:hover{border-color:var(--bad)}
.ed-add{display:flex;gap:8px;flex-wrap:wrap}
.ed-err{color:var(--bad);font-weight:700;margin:0;min-height:1.6em}
.ed-dot{width:12px;height:12px;border-radius:50%;flex:none}

/* Category wheel */
.cat-spin{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.cat-wheel-box{position:relative;width:min(300px,100%);aspect-ratio:1;flex:none}
#catWheel{width:100%;height:100%;display:block;cursor:pointer}
.pointer.small{border-left-width:12px;border-right-width:12px;border-top-width:22px;top:-4px}
#catSpin{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:24%;aspect-ratio:1;border-radius:50%;border:4px solid var(--sand);background:var(--ink);color:var(--sand);font:inherit;font-weight:700;font-size:18px;cursor:pointer}
#catSpin:disabled{opacity:.7;cursor:default}
.cat-side{display:flex;flex-direction:column;gap:12px;flex:1;min-width:200px}
.cat-msg{font-size:20px;font-weight:700;margin:0}
.cat-legend{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:14px}
.cat-legend li{display:inline-flex;align-items:center;gap:6px}
.cat-legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
body.present .cat-wheel-box{width:min(420px,100%)}
body.present .cat-msg{font-size:28px}

.summit-note{background:color-mix(in srgb,var(--saffron) 16%,var(--panel-2));border:1px solid var(--saffron);border-radius:10px;padding:12px 16px;font-weight:500;line-height:1.7}
.summit-note b{color:var(--saffron)}
#drawSpin{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:26%;aspect-ratio:1;border-radius:50%;border:4px solid var(--sand);background:var(--ink);color:var(--sand);font:inherit;font-weight:700;font-size:17px;cursor:pointer}
#drawSpin:disabled{opacity:.7;cursor:default}
#drawWheel{width:100%;height:100%;display:block;cursor:pointer}
.visual-box svg.flag{width:min(300px,100%);height:auto;border-radius:4px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
body.present .visual-box svg.flag{width:min(460px,100%)}
.team-title{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,6vw,72px);line-height:1.1;margin:8px 0 4px;text-align:center;direction:ltr;letter-spacing:-.01em;text-wrap:balance;
  background:linear-gradient(90deg,var(--saffron),var(--coral) 50%,var(--plum));-webkit-background-clip:text;background-clip:text;color:transparent}
body.present .team-title{font-size:clamp(40px,5vw,84px)}
.place{font-size:clamp(34px,6vw,60px);font-weight:700;color:var(--saffron);text-align:center;line-height:1.3}
body.present .place{font-size:clamp(48px,7vw,96px)}
.help-tag{background:var(--plum);color:var(--ink);border-radius:6px;padding:0 8px;font-size:.75em;margin-inline:4px}
.rounds{display:inline-flex;align-items:center;gap:6px;padding:3px 6px 3px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2)}
.rounds b{font-variant-numeric:tabular-nums;min-width:6ch;text-align:center}
.rounds .btn.small{padding:2px 10px;font-size:18px;line-height:1.3}
.rounds .btn:disabled{opacity:.35;cursor:not-allowed}
.round-note{color:var(--saffron);font-weight:700;margin:0}
.lifelines{display:flex;gap:8px;flex-wrap:wrap}
.lifelines:empty{display:none}
.btn.life{background:var(--panel-2);color:var(--sand);border-color:var(--plum);font-size:15px;padding:8px 14px}
.btn.life:disabled{opacity:.4;cursor:not-allowed;filter:none;border-color:var(--line)}
.btn.life small{font-weight:500;color:var(--muted)}
.help-tag.pass{background:var(--coral)}
.opt.gone{opacity:.18;text-decoration:line-through}
.lf{font-size:12px;letter-spacing:1px;margin-inline-start:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes pop{from{transform:scale(.85);opacity:.4}to{transform:scale(1);opacity:1}}
.pop{animation:pop .35s ease-out}
</style>
</head>
<body>

<div class="wrap">
  <h1 class="team-title" lang="en">Our Amazing Marketing Team</h1>
  <header>
    <div>
      <h1>عجلة <span>الفريق</span></h1>
      <p class="sub">لفّ العجلة، اختر نوع السؤال، وخلّ الفريق يحكم.</p>
    </div>
    <div class="toolbar">
      <label class="toggle"><input type="checkbox" id="exclude"><span>لا يتكرر الاسم حتى يأخذ الجميع دورهم</span></label>
      <button class="btn primary small" id="present" type="button">وضع العرض</button>
      <button class="btn ghost small" id="mute" type="button">الصوت: يعمل</button>
    </div>
  </header>

  <div class="grid">
    <div class="col">
      <div class="wheel-box">
        <div class="pointer" aria-hidden="true"></div>
        <canvas id="wheel" aria-label="عجلة أسماء الفريق"></canvas>
        <button id="spin" type="button">لُف</button>
      </div>
    </div>

    <section class="card stage" id="stage" aria-live="polite"></section>
  </div>

  <section class="card map-card">
    <div class="map-head">
      <div>
        <h2>السباق إلى قمة جبل شمس</h2>
        <span class="note">كل إجابة صحيحة تقدّمك محطة. أول من يصل قمة جبل شمس يفوز.</span>
      </div>
      <div class="toolbar">
        <button class="btn ghost small" id="editTeam" type="button">تعديل الأسماء</button>
        <span class="rounds" role="group" aria-label="عدد الجولات"><span class="label">الجولة</span><button class="btn ghost small" id="rMinus" type="button" aria-label="إنقاص عدد الجولات">−</button><b id="rText"></b><button class="btn ghost small" id="rPlus" type="button" aria-label="زيادة عدد الجولات">+</button></span>
        <button class="btn ghost small" id="newRound" type="button">جولة جديدة</button>
        <span id="resetWrap"><button class="btn ghost small" id="resetScores" type="button">لعبة جديدة</button></span>
      </div>
    </div>
    <div class="map-wrap">
      <div class="map-scroll"><div class="map" id="map"></div></div>
      <ul class="score-list" id="scores" aria-label="المتسابقون والنقاط"></ul>
    </div>
  </section>

    const idx=choices[Math.floor(Math.random()*choices.length)], jit=(Math.random()-.5)*seg*.7;
    let target=-Math.PI/2-(idx+.5)*seg+jit; while(target<catRot+TAU*4) target+=TAU;
    let start=catRot, dist=target-start, dur=reduced()?500:3400, t0=performance.now();
    let last=-1;
    boost=()=>{target+=TAU*2;start=catRot;dist=target-start;t0=performance.now();dur=reduced()?500:Math.max(2600,dur*.85);tick(1300,.05,.1);};
    $("#catMsg").textContent="العجلة تدور...";
    (function frame(now){
      const t=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-t,4);
      catRot=start+dist*e;drawCatWheel(cv);
      const sgi=Math.floor(((-Math.PI/2-catRot)%TAU+TAU)%TAU/seg); if(sgi!==last){last=sgi;tick(1100,.025,.06);}
      if(t<1)return requestAnimationFrame(frame);
      catRot%=TAU;catSpinning=false;boost=null;$("#catSpin").disabled=true;cv.onclick=null;const c=keys[idx];S.lastCat=c;save();
      $("#catMsg").innerHTML=`القسم: <b style="color:${CAT_COLORS[c]}">${CATS[c].name}</b>`;fanfare();
      setTimeout(()=>{if(current&&current.who===who)ask(c);},1100);
    })(t0);
  };
  cv.onclick=go;$("#catSpin").onclick=go;
  $("#skip").onclick=()=>{ if(!S.remaining.includes(who)) S.remaining.push(who); save(); renderScores(); drawWheel(); spin(); };
  renderScores();drawWheel();
}
function pickQ(c){
  let free=BANK[c].map((_,i)=>i).filter(i=>!S.used[c].includes(i));
  if(!free.length){S.used[c]=[];free=BANK[c].map((_,i)=>i);}
  const i=free[Math.floor(Math.random()*free.length)];
  S.used[c].push(i);save();return BANK[c][i];
}
function head(c){return `<div class="qhead"><span class="chip ${c}">${CATS[c].name}</span><span class="who" id="who">السؤال لـ <b>${current.who}</b></span></div>`;}

  w.innerHTML=current.target?`<b>${current.who}</b><span class="help-tag pass">ورّط</span><b>${current.target}</b>`
    :current.helper?`السؤال لـ <b>${current.who}</b><span class="help-tag">بمساعدة</span><b>${current.helper}</b>`:`السؤال لـ <b>${current.who}</b>`;}

/* +1 or -1 to the player (and helper, if any). Scores stay between 0 and the summit. */
function score(delta){
  const ns=players(), up=[];
  ns.forEach(n=>{const b=S.scores[n]||0;S.scores[n]=Math.max(0,Math.min(GOAL,b+delta));if(S.scores[n]>=GOAL&&b<GOAL)up.push(n);});
  if(up.length){
    S.final=true;const left=finalLeft();
    stage.insertAdjacentHTML("afterbegin",`<div class="summit-note pop"><b>${up.join(" و")}</b> على قمة جبل شمس! ${left.length?`الجولة تكمل حتى ياخذ الباقون دورهم: ${left.join("، ")}.`:"هذا آخر دور في الجولة."}</div>`);
    [0,350].forEach(d=>setTimeout(fanfare,d));

/* ---------- Race map ---------- */
const STOPS=["مسقط","بركاء","الرستاق","بلد سيت","الحمراء","وادي غول","قمة جبل شمس"];
const GOAL=STOPS.length-1;
const TOKEN_COLORS=["#f3aa3c","#35b9a6","#ea6a50","#9a8ff0","#e98bb4","#7cc4f0","#c9d66a","#f08a4b","#b9a6ff"];
const tokColor=i=>TOKEN_COLORS[i]||`hsl(${(i*47)%360} 70% 66%)`;
TEAM.forEach(n=>{if((S.scores[n]||0)>GOAL)S.scores[n]=GOAL;});
/* The road keeps its original winding shape; stops are spaced evenly along it */
const SHAPE=Array.from({length:11},(_,i)=>({x:930-i*86,y:300-i*18+60*Math.sin(i*1.1)}));
let PTS=STOPS.map((_,i)=>SHAPE[Math.round(i*10/GOAL)]);
function placeStops(d){
  try{const NS="http://www.w3.org/2000/svg",sv=document.createElementNS(NS,"svg"),pa=document.createElementNS(NS,"path");
    sv.setAttribute("style","position:absolute;width:0;height:0;visibility:hidden");pa.setAttribute("d",d);sv.appendChild(pa);document.body.appendChild(sv);
    const L=pa.getTotalLength();PTS=STOPS.map((_,i)=>{const q=pa.getPointAtLength(L*i/GOAL);return {x:q.x,y:q.y};});sv.remove();}catch(e){}
}
function pathD(P){
  let d=`M${P[0].x},${P[0].y}`;
  for(let i=0;i<P.length-1;i++){
    const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||p2;
    const c1={x:p1.x+(p2.x-p0.x)/6,y:p1.y+(p2.y-p0.y)/6},c2={x:p2.x-(p3.x-p1.x)/6,y:p2.y-(p3.y-p1.y)/6};
    d+=` C${c1.x.toFixed(1)},${c1.y.toFixed(1)} ${c2.x.toFixed(1)},${c2.y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;
  }
  return d;
}
function buildMap(){
  const d=pathD(SHAPE);placeStops(d);
  const stops=PTS.map((p,i)=>{
    const last=i===GOAL,first=i===0;
    const r=last||first?17:13, fill=last?"var(--saffron)":first?"var(--teal)":"var(--sand)";
    const below=(i%2===0)?1:-1, ly=p.y+below*(r+20)+ (below>0?6:0);
    return `<circle cx="${p.x}" cy="${p.y}" r="${r}" fill="${fill}" stroke="var(--ink)" stroke-width="3"/>
      <text class="stop-num" x="${p.x}" y="${p.y+5}" text-anchor="middle">${first?"":last?"":i}</text>
      <text class="stop-lbl" x="${p.x}" y="${ly}" text-anchor="middle" ${last?'style="fill:var(--saffron);font-weight:700"':''}>${STOPS[i]}</text>`;
  }).join("");
  const f=PTS[GOAL];
  $("#map").innerHTML=`<svg viewBox="0 0 1000 400" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <polygon points="0,400 0,120 70,40 130,95 190,30 260,110 330,70 400,160 470,400" fill="var(--panel-2)" opacity=".7"/>
    <polygon points="130,95 190,30 225,70 205,75 190,58 160,90" fill="var(--sand)" opacity=".18"/>
    <path d="${d}" fill="none" stroke="var(--line)" stroke-width="26" stroke-linecap="round"/>
    <path d="${d}" fill="none" stroke="var(--sand)" stroke-width="3" stroke-dasharray="10 12" stroke-linecap="round" opacity=".55"/>
    ${stops}
    <line x1="${f.x}" y1="${f.y-16}" x2="${f.x}" y2="${f.y-50}" stroke="var(--sand)" stroke-width="3"/>
    <polygon points="${f.x},${f.y-50} ${f.x-28},${f.y-41} ${f.x},${f.y-32}" fill="var(--coral)"/>
  </svg>`;

  TEAM.forEach((n,i)=>{const t=document.createElement("div");t.className="token";t.id="tok"+i;t.style.background=tokColor(i);t.textContent=n.replace(/^ال/,"").slice(0,3);t.title=n;$("#map").appendChild(t);});
}
function renderTokens(){
  const groups={};
  TEAM.forEach((n,i)=>{const t=$("#tok"+i),ab=S.absent.includes(n);t.hidden=ab;if(ab)return;const st=Math.min(GOAL,S.scores[n]||0);(groups[st]=groups[st]||[]).push(i);});
  Object.entries(groups).forEach(([st,arr])=>{
    const p=PTS[st];
    arr.forEach((i,k)=>{
      const m=arr.length, cols=Math.min(3,m), rows=Math.ceil(m/cols), G=42;
      const dir=(st%2===0)?-1:1, off=m>1?dir*((rows-1)/2*G+38):0;
      const x=p.x+((k%cols)-(cols-1)/2)*G, y=p.y+(Math.floor(k/cols)-(rows-1)/2)*G+off;
      const cx=Math.max(24,Math.min(976,x)), cy=Math.max(24,Math.min(376,y));
      const t=$("#tok"+i);t.style.left=(cx/10)+"%";t.style.top=(cy/4)+"%";
      t.classList.toggle("turn",!!current&&[current.who,current.helper,current.target].includes(TEAM[i]));
    });
  });
}
function resetGame(){wheelNames=null;current=null;S.winner=null;S.final=false;S.tie=null;TEAM.forEach(n=>S.scores[n]=0);S.done={};S.life={};S.round=1;S.remaining=[...TEAM];save();renderScores();drawWheel();idle("بدأت لعبة جديدة");}
function finishGame(){
  clearInterval(timerId);
  let top=atSummit();
  if(!top.length){const ppl=TEAM.filter(n=>!S.absent.includes(n)||S.scores[n]>0),mx=Math.max(...ppl.map(n=>S.scores[n]||0));top=ppl.filter(n=>(S.scores[n]||0)===mx);}
  if(top.length<=1){S.winner=top[0]||TEAM[0];S.tie=null;save();renderScores();showChampion();return;}
  S.tie=top;save();showDraw(top);
}
function drawLabelWheel(cv,labels,rotA){
  const n=labels.length,cx=cv.getContext("2d"),d=window.devicePixelRatio||1,W=cv.width;if(W<40)return;
  const R=W/2,seg=2*Math.PI/n;cx.clearRect(0,0,W,W);cx.save();cx.translate(R,R);
  cx.beginPath();cx.arc(0,0,R-2*d,0,2*Math.PI);cx.fillStyle="#f4ead5";cx.fill();
  labels.forEach((t,i)=>{
    const a0=rotA+i*seg,mid=a0+seg/2,flip=Math.cos(mid)<0;
    cx.beginPath();cx.moveTo(0,0);cx.arc(0,0,R-7*d,a0,a0+seg);cx.closePath();
    cx.fillStyle=tokColor(TEAM.indexOf(t));cx.fill();cx.strokeStyle="#151c31";cx.lineWidth=2*d;cx.stroke();
    cx.save();cx.rotate(flip?mid+Math.PI:mid);cx.fillStyle="#151c31";cx.direction="rtl";cx.textAlign=flip?"left":"right";cx.textBaseline="middle";
    cx.font=`700 ${Math.max(14,Math.min(26,(R/d)*0.12))*d}px "IBM Plex Sans Arabic", Tahoma, sans-serif`;
    cx.fillText(t,flip?-(R-22*d):R-22*d,0);cx.restore();
  });
  cx.restore();
}
function showDraw(names){
  clearInterval(timerId);
  const top=atSummit().length>0;
  stage.innerHTML=`<div class="label">${top?"تعادل في القمة":"تعادل في الصدارة"}</div>
    <p class="cat-msg">${top?"على القمة":`في الصدارة بـ ${S.scores[names[0]]||0} نقاط`}: ${names.join(" و")}. القرعة تحدد الفائز.</p>
    <div class="cat-spin">
      <div class="cat-wheel-box draw-box">
        <div class="pointer small" aria-hidden="true"></div>
        <canvas id="drawWheel" aria-label="عجلة القرعة"></canvas>
        <button id="drawSpin" type="button">قرعة</button>
      </div>
      <div class="cat-side">
        <p class="cat-msg" id="drawMsg">اضغط «قرعة»، والعجلة تدور 10 ثوانٍ وتختار الفائز.</p>
        <div class="timer" id="drawTimer" hidden><span id="drawLeft">10</span><span>ثوانٍ</span><div class="bar"><i id="drawBar"></i></div></div>
      </div>
    </div>`;
  const cv=$("#drawWheel"),dpr=window.devicePixelRatio||1;cv.width=cv.clientWidth*dpr;cv.height=cv.clientWidth*dpr;
  let r0=0;drawLabelWheel(cv,names,r0);
  let busy=false;
  const go=()=>{
    if(busy)return;busy=true;$("#drawSpin").disabled=true;$("#drawTimer").hidden=false;$("#drawMsg").textContent="العجلة تدور...";
    const n=names.length,seg=2*Math.PI/n,TAU=2*Math.PI,idx=Math.floor(Math.random()*n),jit=(Math.random()-.5)*seg*.6;
    let target=-Math.PI/2-(idx+.5)*seg+jit;while(target<r0+TAU*14)target+=TAU;
    const start=r0,dist=target-start,dur=10000,t0=performance.now();let last=-1,lastSec=10;
    (function frame(now){
      const t=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-t,3);
      r0=start+dist*e;drawLabelWheel(cv,names,r0);
      const sgi=Math.floor(((-Math.PI/2-r0)%TAU+TAU)%TAU/seg);if(sgi!==last){last=sgi;tick(900,.03,.06);}
      const sec=Math.ceil((1-t)*10);if(sec!==lastSec){lastSec=sec;$("#drawLeft").textContent=sec;$("#drawBar").style.width=(sec*10)+"%";}
      if(t<1)return requestAnimationFrame(frame);
      S.winner=names[idx];save();renderScores();
      $("#drawMsg").innerHTML=`الفائز بالقرعة: <b style="color:var(--saffron)">${S.winner}</b>`;fanfare();
      setTimeout(showChampion,1800);
    })(t0);
  };
  cv.onclick=go;$("#drawSpin").onclick=go;
}
function showChampion(){
  clearInterval(timerId);spinBtn.disabled=false;
  const ppl=TEAM.filter(n=>!S.absent.includes(n)||S.scores[n]>0);
  const rank=[...ppl].sort((a,b)=>(b===S.winner)-(a===S.winner)||S.scores[b]-S.scores[a]);
  stage.innerHTML=`<div class="champ">
    <div class="label">${S.tie&&S.tie.length>1?`الفوز بالقرعة بعد التعادل مع ${S.tie.filter(x=>x!==S.winner).join(" و")}`:(S.scores[S.winner]||0)>=GOAL?"بطل قمة جبل شمس":`بطل المسابقة بعد ${S.round} ${S.round===1?"جولة":S.round===2?"جولتين":S.round<=10?"جولات":"جولة"}`}</div>
    <p class="winner pop">${S.winner}</p>
    <ol class="rank">${rank.map((n,i)=>`<li><span>${i+1}. ${n}</span><span>${STOPS[Math.min(GOAL,S.scores[n])]} · ${S.scores[n]} نقاط</span></li>`).join("")}</ol>
    <div class="actions" style="margin-top:0"><button class="btn primary" id="newRace" type="button">لعبة جديدة</button></div>
  </div>`;
  $("#newRace").onclick=resetGame;
  [0,350,700].forEach(d=>setTimeout(fanfare,d));
}

/* ---------- Team editor ---------- */
const cleanName=n=>String(n).replace(/[<>"'`&]/g,"").replace(/\s+/g," ").trim().slice(0,24);
function openEditor(){
  if(spinning)return;
  clearInterval(timerId);
  let rows=TEAM.map(n=>({orig:n,name:n}));
  const draw=(msg="")=>{
    stage.innerHTML=`<div class="editor">
      <h2>تعديل أسماء الفريق</h2>
      <p class="note">عدّل أي اسم مباشرة، أو احذفه، أو أضف اسمًا جديدًا. نقاط الشخص تبقى معه إذا غيّرت اسمه.</p>
      <ul class="ed-list">${rows.map((r,i)=>`<li><span class="ed-dot" style="background:${tokColor(i)}"></span><input id="ed-${i}" data-i="${i}" value="${r.name}" aria-label="اسم ${i+1}"><button class="ed-del" type="button" data-i="${i}" aria-label="حذف ${r.name}">حذف</button></li>`).join("")}</ul>
      <form class="ed-add" id="edAdd"><input id="ed-new" placeholder="اسم جديد" aria-label="اسم جديد"><button class="btn ghost" type="submit">إضافة</button></form>
      <p class="ed-err" id="edErr">${msg}</p>
      <div class="actions">
        <button class="btn primary" id="edSave" type="button">حفظ الفريق</button>
        <button class="btn ghost" id="edCancel" type="button">إلغاء</button>
        <button class="btn ghost" id="edDefault" type="button">الأسماء الأصلية</button>
      </div>
    </div>`;
    stage.querySelectorAll(".ed-list input").forEach(inp=>inp.oninput=()=>{rows[+inp.dataset.i].name=inp.value;});
    stage.querySelectorAll(".ed-del").forEach(b=>b.onclick=()=>{rows.splice(+b.dataset.i,1);draw();});
    $("#edAdd").onsubmit=e=>{e.preventDefault();const v=cleanName($("#ed-new").value);if(!v)return;
      if(rows.some(r=>cleanName(r.name)===v)){draw(`«${v}» موجود في القائمة.`);return;}
      rows.push({orig:null,name:v});draw();const x=$("#ed-new");x&&x.focus();};
    $("#edCancel").onclick=()=>idle();
    $("#edDefault").onclick=()=>{rows=DEFAULT_TEAM.map(n=>({orig:TEAM.includes(n)?n:null,name:n}));draw("رجعت الأسماء الأصلية. اضغط «حفظ الفريق» لتثبيتها.");};
    $("#edSave").onclick=()=>{
      const pend=cleanName(($("#ed-new")||{}).value||"");
      if(pend&&!rows.some(r=>cleanName(r.name)===pend))rows.push({orig:null,name:pend});
      const list=rows.map(r=>({orig:r.orig,name:cleanName(r.name)})).filter(r=>r.name);
      const names=list.map(r=>r.name);
      const dup=names.find((n,i)=>names.indexOf(n)!==i);
      if(dup){draw(`الاسم «${dup}» مكرر. غيّر أحدهما.`);return;}
      if(names.length<2){draw("العجلة تحتاج اسمين على الأقل.");return;}
      if(names.length>20){draw("الحد الأقصى 20 اسمًا حتى تبقى العجلة مقروءة.");return;}
      saveTeam(list);
    };
  };
  draw();
}
function saveTeam(list){
  const mv=(obj,def)=>{const o={};list.forEach(r=>{o[r.name]=r.orig&&obj[r.orig]!==undefined?obj[r.orig]:def();});return o;};
  S.scores=mv(S.scores,()=>0);
  S.done=mv(S.done,()=>({}));
  S.life=mv(S.life,()=>({}));
  S.absent=list.filter(r=>r.orig&&S.absent.includes(r.orig)).map(r=>r.name);
  S.remaining=list.filter(r=>!r.orig||S.remaining.includes(r.orig)).map(r=>r.name);
  TEAM=list.map(r=>r.name);S.team=[...TEAM];
  wheelNames=null;current=null;save();
  buildMap();renderScores();drawWheel();idle("تم حفظ الفريق");
}

/* ---------- Scoreboard ---------- */
function renderScores(){
  const max=Math.max(...TEAM.map(n=>S.scores[n]));
  const list=[...TEAM].sort((a,b)=>S.scores[b]-S.scores[a]);
  $("#scores").innerHTML=list.map(n=>{
    const ab=S.absent.includes(n);
    const done=!ab&&(S.exclude||S.final)&&!S.remaining.includes(n);
    const tag=ab?"":STOPS[Math.min(GOAL,S.scores[n]||0)];
    return `<li class="${done?"done":""} ${ab?"absent":""} ${current&&[current.who,current.helper,current.target].includes(n)?"turn":""} ${max>0&&S.scores[n]===max?"lead":""}"><i class="dot" style="background:${tokColor(TEAM.indexOf(n))}"></i><span class="nm">${n}<span class="lf" title="الخيارات المتبقية">${["pass","fifty","swap"].filter(k=>!lifeUsed(n,k)).map(k=>({pass:"👉",fifty:"✂️",swap:"🔄"})[k]).join("")}</span></span><span class="tag">${tag}</span><button class="att ${ab?"off":""}" type="button" data-n="${n}" aria-pressed="${!ab}">${ab?"غائب":"حاضر"}</button><span class="pts">${S.scores[n]}/${GOAL}</span></li>`;
  }).join("");
  document.querySelectorAll(".att").forEach(b=>b.onclick=()=>{
    const n=b.dataset.n;
    S.absent=S.absent.includes(n)?S.absent.filter(x=>x!==n):[...S.absent,n];
    if(!spinning&&!current)wheelNames=null;save();renderScores();if(!spinning)drawWheel();
  });
  if($("#tok0"))renderTokens();
  renderRounds();
}
function bindReset(){
  $("#resetScores").onclick=()=>{
    $("#resetWrap").innerHTML=`<span class="confirm">متأكد؟ <button class="btn ghost small" id="yes" type="button">نعم، ابدأ من جديد</button><button class="btn ghost small" id="no" type="button">إلغاء</button></span>`;
    $("#yes").onclick=()=>{resetGame();restoreReset();};
    $("#no").onclick=restoreReset;
  };
}
function restoreReset(){$("#resetWrap").innerHTML=`<button class="btn ghost small" id="resetScores" type="button">لعبة جديدة</button>`;bindReset();}

/* ---------- Init ---------- */
$("#exclude").checked=S.exclude;
$("#exclude").onchange=e=>{S.exclude=e.target.checked;if(!spinning&&!current)wheelNames=null;save();drawWheel();renderScores();};
const muteBtn=$("#mute");
const setMute=()=>muteBtn.textContent=S.muted?"الصوت: مكتوم":"الصوت: يعمل";
muteBtn.onclick=()=>{S.muted=!S.muted;save();setMute();};setMute();
$("#editTeam").onclick=openEditor;
$("#newRound").onclick=()=>{if(spinning||catSpinning||S.winner)return;if(S.final){idle("الجولة الأخيرة لازم تكمل أولًا");return;}
  if(S.round>=S.rounds){idle(`هذه آخر جولة (${S.round} من ${S.rounds}). زِد عدد الجولات بزر + إذا تبون جولة إضافية.`);return;}
  clearInterval(timerId);S.round++;S.remaining=[...TEAM];wheelNames=null;current=null;save();drawWheel();renderScores();idle(`بدأت الجولة ${S.round}`);};
$("#rMinus").onclick=()=>{if(S.rounds>S.round){S.rounds--;save();renderRounds();if(stage.querySelector(".idle"))idle(S.rounds===S.round?"هذه صارت الجولة الأخيرة":`عدد الجولات صار ${S.rounds}`);}};
$("#rPlus").onclick=()=>{if(S.rounds<30){S.rounds++;save();renderRounds();if(stage.querySelector(".idle"))idle(`عدد الجولات صار ${S.rounds}`);}};
const presBtn=$("#present");
function setPresent(on){document.body.classList.toggle("present",on);presBtn.textContent=on?"خروج من وضع العرض":"وضع العرض";setTimeout(sizeCanvas,60);}
presBtn.onclick=()=>{
  const on=!document.body.classList.contains("present");setPresent(on);
  try{if(on&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});
      else if(!on&&document.fullscreenElement)document.exitFullscreen().catch(()=>{});}catch(e){}
};
document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement&&document.body.classList.contains("present"))setPresent(false);});
spinBtn.onclick=spin;canvas.style.cursor="pointer";canvas.onclick=()=>{if(spinning||!spinBtn.disabled)spin();};
bindReset();
document.documentElement.dir="rtl";document.documentElement.lang="ar";
window.addEventListener("resize",sizeCanvas);
buildMap();renderScores();if(gameOver())showChampion();else if(S.final&&!finalLeft().length)finishGame();else idle();sizeCanvas();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(drawWheel);
</script>
